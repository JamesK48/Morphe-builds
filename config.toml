enable-module-update = false # APKs only, no root modules
parallel-jobs = 1

# One table per app. Add 'enabled = false' to pause an app without deleting it.
# Full option list: CONFIG.md
#
# version = "auto" (the default) picks the newest app version that the patches support,
# which is what Morphe Manager recommends too.

[YouTube-Morphe]
app-name = "YouTube"
build-mode = "apk"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

[Music-Morphe]
app-name = "Music"
build-mode = "apk"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"

[Reddit-Morphe]
app-name = "Reddit"
build-mode = "apk"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit/"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.reddit.frontpage"
dpi = "120-640dpi"

# Twitter with Piko. If you use "NewX" in Morphe instead, change patches-source to
# "crimera/piko-newx" and set version = "latest".
[Twitter]
app-name = "Twitter"
build-mode = "apk"
arch = "arm64-v8a"
patches-source = "crimera/piko"
rv-brand = "Piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter/"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.twitter.android"
